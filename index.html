                    <i class="fa-solid fa-moon text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-cyan-400 via-indigo-300 to-amber-300 bg-clip-text text-transparent">
                        Disney Springs 3rd Shift Operations

                    <p class="text-xs text-slate-400">Disney Springs Leadership Recap System</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <div id="syncIndicator" class="bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-2">
                    <i class="fa-solid fa-circle-check text-emerald-400"></i> <span id="syncText">Live Synced Across PCs</span>

                <div class="bg-slate-800/80 border border-slate-700/60 rounded-lg px-3 py-1.5 flex items-center gap-2 text-sm">
                    <i class="fa-regular fa-calendar text-cyan-400"></i>
                    <span id="currentDateDisplay" class="font-medium text-slate-200"></span>
                </div>
                <button onclick="downloadEmlFile()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-lg shadow-indigo-600/30 flex items-center gap-2">

    <!-- Main Container -->

        <span id="toastMessage" class="text-sm font-medium">Synced successfully!</span>
    </div>

                    logs: [

                    ],

                    ],

                    ]
                },
                {

                    status: "Active",
                    metrics: { scheduled: 152.0, actual: 152.0, callIn: 16.0, variance: 0.0, variancePct: 0.0000, attendanceRate: 1.0000 },

                    ],

                },

                },
                {

                    metrics: { scheduled: 168.0, actual: 0.0, callIn: 0.0, variance: -168.0, variancePct: -1.0000, attendanceRate: 0.0000 },
                    headcount: { present: 0, callSick: 0, fmla: 0, ado: 0, er: 0, ros: 0, late: 0, totalSched: 22 },
                    logs: [{ leader: "Sabine Bade", detail: "On approved Leave of Absence." }],
                    training: [],
                    contracts: []
                },
                {
                    name: "Roxanne Canales",
                    status: "Covering Overnight Duty",
                    metrics: { scheduled: 168.0, actual: 168.0, callIn: 0.0, variance: 0.0, variancePct: 0.0000, attendanceRate: 1.0000 },
                    headcount: { present: 22, callSick: 0, fmla: 0, ado: 0, er: 0, ros: 0, late: 0, totalSched: 22 },
                    logs: [{ leader: "Roxanne Canales", detail: "Covering overnight duty for alternate zone support." }],

                },
                {
                    name: "Michael Rivera",
                    status: "Off",
                    metrics: { scheduled: 168.0, actual: 0.0, callIn: 0.0, variance: -168.0, variancePct: -1.0000, attendanceRate: 0.0000 },
                    headcount: { present: 0, callSick: 0, fmla: 0, ado: 0, er: 0, ros: 0, late: 0, totalSched: 22 },
                    logs: [{ leader: "Michael Rivera", detail: "Off duty." }],
                    training: [],
                    contracts: []
                }
            ]
        };

        const activeLeadersList = ["Henry Powell", "Zoroaya Hernandez", "Jonathan Jimenez", "Cheryl Moore", "Sabine Bade", "Roxanne Canales", "Michael Rivera"];
        const trainingModulesList = ["Area Washdown", "Pressure washing", "Night 1 Facilitation", "Trainer on Duty"];

        let isSaving = false;
        let lastStateHash = "";

        async function fetchSharedData() {
            if (isSaving) return;
            try {
                const response = await fetch(API_URL, { headers: { "X-Master-Key": "$2a$10$Xb7vL5mN8q1v2z3w4k5l6O" } });
                if (response.ok) {
                    const result = await response.json();
                    const remoteData = result.record;
                    if (remoteData && remoteData.leaders) {
                        const hash = JSON.stringify(remoteData);
                        if (hash !== lastStateHash) {
                            appData = remoteData;
                            lastStateHash = hash;
                            renderApp();
                        }
                    }
                }
            } catch (e) {}
        }

        async function saveData() {
            isSaving = true;
            const hash = JSON.stringify(appData);
            lastStateHash = hash;
            try {
                await fetch(API_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': '$2a$10$Xb7vL5mN8q1v2z3w4k5l6O' },
                    body: JSON.stringify(appData)
                });
                document.getElementById('syncText').innerText = "Live Synced Across PCs";
            } catch (e) {
                document.getElementById('syncText').innerText = "Save Error";
            }
            setTimeout(() => { isSaving = false; }, 300);
        }

        function renderTabs() {
            const container = document.getElementById('leaderTabs');
            container.innerHTML = '';
            appData.leaders.forEach(leader => {
                const isActive = leader.name === appData.activeTab;
                let statusColor = 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30';
                if (leader.status === 'Off') statusColor = 'bg-amber-500/20 text-amber-400 border-amber-500/30';
                if (leader.status === 'Leave of Absence') statusColor = 'bg-rose-500/20 text-rose-400 border-rose-500/30';
                if (leader.status === 'Covering Overnight Duty') statusColor = 'bg-purple-500/20 text-purple-400 border-purple-500/30';

                const btn = document.createElement('button');
                btn.className = `px-4 py-3 rounded-xl font-medium text-sm whitespace-nowrap transition flex items-center gap-2.5 border ${isActive ? 'bg-indigo-600 border-indigo-500 text-white shadow-lg shadow-indigo-600/30' : 'bg-slate-900 border-slate-800 text-slate-300 hover:bg-slate-800'}`;
                btn.innerHTML = `<span>${leader.name}</span><span class="text-[10px] px-2 py-0.5 rounded-full border ${statusColor}">${leader.status}</span>`;
                btn.onclick = () => {
                    appData.activeTab = leader.name;
                    renderApp();
                    saveData();
                };
                container.appendChild(btn);
            });
        }

        function renderApp() {
            try {
                renderTabs();
                const container = document.getElementById('tabContentContainer');
                const leader = appData.leaders.find(l => l.name === appData.activeTab) || appData.leaders[0];

                let statusColor = 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30';
                if (leader.status === 'Off') statusColor = 'bg-amber-500/20 text-amber-400 border-amber-500/30';
                if (leader.status === 'Leave of Absence') statusColor = 'bg-rose-500/20 text-rose-400 border-rose-500/30';
                if (leader.status === 'Covering Overnight Duty') statusColor = 'bg-purple-500/20 text-purple-400 border-purple-500/30';

                let logsHtml = leader.logs.map((log, index) => `
                    <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col sm:flex-row gap-4 items-center justify-between">
                        <div class="w-full sm:w-56 shrink-0">
                            <span class="text-[10px] text-slate-400 uppercase block mb-1">Logging Leader</span>
                            <select onchange="updateLogLeader('${leader.name}', ${index}, this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-amber-300 font-semibold focus:outline-none focus:border-amber-500">
                                ${activeLeadersList.map(ldr => `<option value="${ldr}" ${log.leader === ldr ? 'selected' : ''}>${ldr}</option>`).join('')}
                            </select>
                        </div>
                        <div class="w-full grow">
                            <span class="text-[10px] text-slate-400 uppercase block mb-1">Shift Activity / Comment</span>
                            <textarea rows="2" oninput="updateLog('${leader.name}', ${index}, 'detail', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:border-amber-500 resize-y">${log.detail}</textarea>
                        </div>
                        <button onclick="deleteLog('${leader.name}', ${index})" class="text-slate-500 hover:text-rose-400 p-2 self-end sm:self-center transition"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                `).join('');

                let trainingHtml = leader.training.map((t, idx) => `
                    <tr class="hover:bg-slate-950/40">
                        <td class="p-3"><input type="text" value="${t.trainer}" oninput="updateTraining('${leader.name}', ${idx}, 'trainer', this.value)" class="bg-slate-950 border border-slate-700 rounded px-2 py-1 w-full text-white"></td>
                        <td class="p-3"><input type="text" value="${t.trainee}" oninput="updateTraining('${leader.name}', ${idx}, 'trainee', this.value)" class="bg-slate-950 border border-slate-700 rounded px-2 py-1 w-full text-white"></td>
                        <td class="p-3">
                            <select onchange="updateTraining('${leader.name}', ${idx}, 'module', this.value)" class="bg-slate-950 border border-slate-700 rounded px-2.5 py-1.5 w-full text-xs text-white font-medium">
                                ${trainingModulesList.map(mod => `<option value="${mod}" ${t.module === mod ? 'selected' : ''}>${mod}</option>`).join('')}
                            </select>
                        </td>
                        <td class="p-3 text-center"><label class="text-[10px] text-slate-400 block">Night 1</label><input type="checkbox" ${t.n1 ? 'checked' : ''} onchange="updateTraining('${leader.name}', ${idx}, 'n1', this.checked ? 1 : 0)" class="w-4 h-4 rounded bg-slate-950 border-slate-700 text-purple-600 cursor-pointer"></td>
                        <td class="p-3 text-center"><label class="text-[10px] text-slate-400 block">Night 2</label><input type="checkbox" ${t.n2 ? 'checked' : ''} onchange="updateTraining('${leader.name}', ${idx}, 'n2', this.checked ? 1 : 0)" class="w-4 h-4 rounded bg-slate-950 border-slate-700 text-purple-600 cursor-pointer"></td>
                        <td class="p-3 text-center"><label class="text-[10px] text-slate-400 block">Night 3</label><input type="checkbox" ${t.n3 ? 'checked' : ''} onchange="updateTraining('${leader.name}', ${idx}, 'n3', this.checked ? 1 : 0)" class="w-4 h-4 rounded bg-slate-950 border-slate-700 text-purple-600 cursor-pointer"></td>

                    </div>
                `).join('');

                container.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-wrap justify-between items-center gap-4">
                        <div>
                            <div class="flex items-center gap-3">
                                <h2 class="text-2xl font-bold text-white">${leader.name}</h2>
                                <span class="text-xs px-3 py-1 rounded-full border font-medium ${statusColor}">${leader.status}</span>
                            </div>
                            <p class="text-sm text-slate-400 mt-1">3rd Shift Custodial Operations — End of Shift Recap & Log</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Operational Status:</label>
                            <select onchange="updateLeaderStatus('${leader.name}', this.value)" class="bg-slate-950 border border-slate-700 text-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                                <option value="Active" ${leader.status === 'Active' ? 'selected' : ''}>Active</option>
                                <option value="Off" ${leader.status === 'Off' ? 'selected' : ''}>Off</option>
                                <option value="Covering Overnight Duty" ${leader.status === 'Covering Overnight Duty' ? 'selected' : ''}>Covering Overnight Duty</option>
                                <option value="Leave of Absence" ${leader.status === 'Leave of Absence' ? 'selected' : ''}>Leave of Absence (LOA)</option>
                            </select>
                        </div>
                    </div>

                    <!-- 1. Shift Attendance & Labor Metrics -->
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                        <div class="flex justify-between items-center">
                            <h3 class="text-base font-bold text-cyan-400"><i class="fa-solid fa-chart-line"></i> 1. Shift Attendance & Labor Metrics</h3>
                            <button onclick="recalcMetrics('${leader.name}')" class="text-xs text-indigo-400 bg-indigo-500/10 px-3 py-1 rounded-lg border border-indigo-500/30">Recalculate</button>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4">
                            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                <span class="text-[11px] font-semibold text-slate-400 block">Scheduled Labor (Hrs)</span>
                                <input type="number" step="0.1" id="schedLabor" value="${leader.metrics.scheduled.toFixed(1)}" onblur="formatDecimalInput(this)" oninput="syncMetrics('${leader.name}')" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-lg font-bold text-white mt-1">
                            </div>
                            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                <span class="text-[11px] font-semibold text-slate-400 block">Actual Labor (Hrs)</span>
                                <input type="number" step="0.1" id="actualLabor" value="${leader.metrics.actual.toFixed(1)}" onblur="formatDecimalInput(this)" oninput="syncMetrics('${leader.name}')" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-lg font-bold text-emerald-400 mt-1">

                            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">

                                <input type="number" step="0.1" id="callInFactor" value="${leader.metrics.callIn.toFixed(1)}" onblur="formatDecimalInput(this)" oninput="syncMetrics('${leader.name}')" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-lg font-bold text-amber-400 mt-1">
                            </div>
                            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                <span class="text-[11px] font-semibold text-slate-400 block">Labor Variance</span>
                                <span id="dispVariance" class="text-lg font-bold text-indigo-400 block mt-1">${leader.metrics.variance.toFixed(1)}</span>
                            </div>

                            </div>
                            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                <span class="text-[11px] font-semibold text-slate-400 block">Attendance Rate</span>
                                <span id="dispAttRate" class="text-lg font-bold text-cyan-400 block mt-1">${leader.metrics.attendanceRate.toFixed(4)}</span>
                            </div>
                        </div>
                    </div>

                    <!-- 2. Logs -->
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                        <div class="flex justify-between items-center">
                            <h3 class="text-base font-bold text-amber-400"><i class="fa-solid fa-clipboard-user"></i> 2. Leadership End of Shift Logs</h3>
                            <button onclick="addLogEntry('${leader.name}')" class="bg-amber-500 text-slate-950 font-semibold px-3 py-1.5 rounded-lg text-xs"><i class="fa-solid fa-plus"></i> Add Log</button>

                        <div class="space-y-3">${logsHtml}</div>

                    <!-- 3. Training -->
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                        <div class="flex justify-between items-center">
                            <h3 class="text-base font-bold text-purple-400"><i class="fa-solid fa-graduation-cap"></i> 3. Training Tracker</h3>
                            <button onclick="addTraining('${leader.name}')" class="bg-purple-600 text-white font-semibold px-3 py-1.5 rounded-lg text-xs"><i class="fa-solid fa-plus"></i> Add Training</button>
                        </div>
                        <table class="w-full text-left text-xs text-slate-300">
                            <thead class="bg-slate-950 text-slate-400 uppercase border-b border-slate-800">
                                <tr>
                                    <th class="p-3">Trainer</th>
                                    <th class="p-3">Trainee</th>
                                    <th class="p-3">Training Module</th>
                                    <th class="p-3 text-center">Night 1</th>
                                    <th class="p-3 text-center">Night 2</th>
                                    <th class="p-3 text-center">Night 3</th>
                                    <th class="p-3">Assessment</th>
                                    <th class="p-3 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800">${trainingHtml}</tbody>
                        </table>
                    </div>

                    <!-- 4. Contracts -->
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                        <div class="flex justify-between items-center">
                            <h3 class="text-base font-bold text-emerald-400"><i class="fa-solid fa-file-contract"></i> 4. Specialized Contracts & Work Completed</h3>
                            <button onclick="addContract('${leader.name}')" class="bg-emerald-600 text-white font-semibold px-3 py-1.5 rounded-lg text-xs"><i class="fa-solid fa-plus"></i> Add Contract</button>
                        </div>
                        <div class="space-y-3">${contractsHtml}</div>
                    </div>
                `;

                // Live dynamic date display
                const todayStr = new Date().toISOString().split('T')[0];
                appData.currentDate = todayStr;
                document.getElementById('currentDateDisplay').innerText = todayStr;
            } catch(err) {
                console.error("Render error:", err);
            }
        }

        function formatDecimalInput(input) {
            let val = parseFloat(input.value);
            if (!isNaN(val)) {
                input.value = val.toFixed(1);
            } else {
                input.value = "0.0";
            }
            syncMetrics(appData.activeTab);
        }

        function updateLeaderStatus(leaderName, status) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (l) l.status = status;
            saveData();
            renderApp();
        }

        function syncMetrics(leaderName) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (!l) return;
            l.metrics.scheduled = parseFloat(document.getElementById('schedLabor').value) || 0.0;
            l.metrics.actual = parseFloat(document.getElementById('actualLabor').value) || 0.0;
            l.metrics.callIn = parseFloat(document.getElementById('callInFactor').value) || 0.0;
            l.metrics.variance = Number((l.metrics.actual - l.metrics.scheduled).toFixed(1));
            l.metrics.variancePct = l.metrics.scheduled > 0 ? Number((l.metrics.variance / l.metrics.scheduled).toFixed(4)) : 0.0;
            l.metrics.attendanceRate = l.metrics.scheduled > 0 ? Number((l.metrics.actual / l.metrics.scheduled).toFixed(4)) : 0.0;
            saveData();
        }

        function recalcMetrics(leaderName) {
            saveData();
            renderApp();
        }

        function addLogEntry(leaderName) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (l) l.logs.push({ leader: leaderName, detail: "New note..." });
            saveData();
            renderApp();
        }

        function updateLog(leaderName, idx, field, val) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (l && l.logs[idx]) { l.logs[idx][field] = val; saveData(); }
        }

        function updateLogLeader(leaderName, idx, newLeader) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (l && l.logs[idx]) { l.logs[idx].leader = newLeader; saveData(); }
        }

        function deleteLog(leaderName, idx) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (l) l.logs.splice(idx, 1);
            saveData();
            renderApp();
        }

        function addTraining(leaderName) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (l) l.training.push({ trainer: "Trainer", trainee: "Trainee", module: "Area Washdown", n1: 0, n2: 0, n3: 0, assessment: "Pending Evaluation" });
            saveData();
            renderApp();
        }

        function updateTraining(leaderName, idx, field, val) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (l && l.training[idx]) { l.training[idx][field] = val; saveData(); }
        }

        function deleteTraining(leaderName, idx) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (l) l.training.splice(idx, 1);
            saveData();
            renderApp();
        }

        function addContract(leaderName) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (l) l.contracts.push({ name: "Contract Task", workDone: "Work completed..." });
            saveData();
            renderApp();
        }

        function updateContract(leaderName, idx, field, val) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (l && l.contracts[idx]) { l.contracts[idx][field] = val; saveData(); }
        }

        function deleteContract(leaderName, idx) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (l) l.contracts.splice(idx, 1);
            saveData();
            renderApp();
        }

        function downloadEmlFile() {
            const leader = appData.leaders.find(l => l.name === appData.activeTab) || appData.leaders[0];
            const subject = `3rd Shift Custodial Operations Recap — ${appData.currentDate} (${leader.name})`;
            let htmlBody = `<!DOCTYPE html><html><body><h2>${leader.name} Recap</h2></body></html>`;
            const emlContent = `X-Unsent: 1\nMIME-Version: 1.0\nSubject: ${subject}\nContent-Type: text/html; charset=UTF-8\n\n` + htmlBody;
            const blob = new Blob([emlContent], { type: 'message/rfc822' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Recap_${leader.name}.eml`;
            a.click();
        }

        window.onload = async function() {
            await fetchSharedData();
            renderApp();
            setInterval(fetchSharedData, 2000);
        };
    </script>
</body>
</html>
