<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3rd Shift Custodial Operations - Leadership Recap & Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        disney: {
                            dark: '#0B132B',
                            navy: '#1C2541',
                            blue: '#3A506B',
                            accent: '#48CAE4',
                            gold: '#FFB703',
                            purple: '#7209B7',
                            card: '#1e293b'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">

    <!-- Top Navigation Bar -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 shadow-xl">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                    <i class="fa-solid fa-moon text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-cyan-400 via-indigo-300 to-amber-300 bg-clip-text text-transparent">
                        Disney Springs 3rd Shift Operations
                    </h1>
                    <p class="text-xs text-slate-400">Disney Springs Leadership Recap System</p>
                </div>
            </div>

            <div class="flex items-center gap-2 flex-wrap">
                <div class="bg-slate-800/80 border border-slate-700/60 rounded-lg px-3 py-1.5 flex items-center gap-2 text-sm">
                    <i class="fa-regular fa-calendar text-cyan-400"></i>
                    <span id="currentDateDisplay" class="font-medium text-slate-200"></span>
                </div>
                <button onclick="copyTeamData()" class="bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-2 rounded-lg text-xs font-medium transition flex items-center gap-1.5 shadow-lg shadow-cyan-600/20" title="Copy shift data to share with team">
                    <i class="fa-solid fa-copy"></i> Copy Team Data
                </button>
                <button onclick="pasteTeamData()" class="bg-teal-600 hover:bg-teal-500 text-white px-3 py-2 rounded-lg text-xs font-medium transition flex items-center gap-1.5 shadow-lg shadow-teal-600/20" title="Paste shift data from teammate">
                    <i class="fa-solid fa-paste"></i> Paste Team Data
                </button>
                <button onclick="exportBackup()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-lg text-xs font-medium transition flex items-center gap-1.5 shadow-lg shadow-emerald-600/20" title="Save backup file with timestamp first">
                    <i class="fa-solid fa-download"></i> Save Backup
                </button>
                <label class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-2 rounded-lg text-xs font-medium transition flex items-center gap-1.5 cursor-pointer shadow-lg shadow-amber-600/20" title="Load backup file">
                    <i class="fa-solid fa-upload"></i> Restore <input type="file" id="importFile" onchange="importBackup(event)" class="hidden" accept=".json">
                </label>
                <button onclick="downloadEmlFile()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-lg text-xs font-medium transition flex items-center gap-1.5 shadow-lg shadow-indigo-600/30">
                    <i class="fa-solid fa-file-arrow-down"></i> .EML File
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
        <!-- Tabs Navigation -->
        <div class="flex overflow-x-auto pb-2 gap-2 border-b border-slate-800" id="leaderTabs"></div>
        <!-- Tab Content Area -->
        <div id="tabContentContainer" class="space-y-6"></div>
    </main>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 bg-emerald-600 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 transform translate-y-24 opacity-0 transition-all duration-300 z-50">
        <i class="fa-solid fa-circle-check text-lg"></i>
        <span id="toastMessage" class="text-sm font-medium">Saved successfully!</span>
    </div>

    <script>
        const STORAGE_KEY = "disney_3rd_shift_recap_permanent_v3";

        const defaultData = {
            currentDate: new Date().toISOString().split('T')[0],
            activeTab: "Joint Leadership Recap",
            leaders: [
                {
                    name: "Joint Leadership Recap",
                    status: "Active",
                    metrics: { scheduled: 1092.0, actual: 462.0, callIn: 112.0, variance: -630.0, variancePct: -0.5768, attendanceRate: 0.4230 },
                    headcount: { present: 133, callSick: 0, fmla: 0, ado: 0, er: 0, ros: 0, late: 0, totalSched: 133 },
                    logs: [
                        { leader: "Henry Powell", detail: "Joint team briefing completed. Area washdown assignments verified across Disney Springs zones." },
                        { leader: "Zoroaya Hernandez", detail: "Inspected Kings Building Fronts, Town Center walkways, and water feature maintenance." }
                    ],
                    training: [
                        { trainer: "Raul", trainee: "Jovi", module: "Trainer on Duty", n1: 0, n2: 0, n3: 0, assessment: "Pending Final Review" },
                        { trainer: "Henry Powell", trainee: "Team Lead", module: "Night 1 Facilitation", n1: 1, n2: 1, n3: 1, assessment: "Passed - Certified" }
                    ],
                    contracts: [
                        { name: "Kings Projects", workDone: "Scrub the Floor in WOD Male, Lime Garage and Uniqlo Guest RR" },
                        { name: "Kings Carpet Cleaning", workDone: "CIRQUE CURTAINS" },
                        { name: "Kings Building Fronts", workDone: "CIRQUE, WATERMELON LOT SIDE" },
                        { name: "KSI Waterway cleaning", workDone: "STK FOUNTAIN, ARCHIMEDES, 4 Ponds Net/ Vacuum Springs" }
                    ]
                },
                {
                    name: "Zoroaya Hernandez",
                    status: "Active",
                    metrics: { scheduled: 152.0, actual: 159.8, callIn: 16.0, variance: 7.8, variancePct: 0.0513, attendanceRate: 1.0513 },
                    headcount: { present: 20, callSick: 0, fmla: 0, ado: 0, er: 0, ros: 0, late: 0, totalSched: 20 },
                    logs: [
                        { leader: "Zoroaya Hernandez", detail: "Conducted pre-shift safety huddle and equipment allocation for West Side zones." },
                        { leader: "Zoroaya Hernandez", detail: "Oversaw specialized floor care and compliance checks." }
                    ],
                    training: [
                        { trainer: "Zoroaya", trainee: "Trainee A", module: "Pressure washing", n1: 1, n2: 1, n3: 0, assessment: "Needs Remediation" }
                    ],
                    contracts: [
                        { name: "West Side Deep Clean", workDone: "Town Center concourse washdown and gum removal." }
                    ]
                },
                {
                    name: "Henry Powell",
                    status: "Active",
                    metrics: { scheduled: 143.0, actual: 149.5, callIn: 16.0, variance: 6.5, variancePct: 0.0455, attendanceRate: 1.0455 },
                    headcount: { present: 19, callSick: 0, fmla: 0, ado: 0, er: 0, ros: 0, late: 0, totalSched: 19 },
                    logs: [
                        { leader: "Henry Powell", detail: "Continue catching up on my emails. Made assignment adjustments. Check RACI Chart. Updated Attendance Matrix." },
                        { leader: "Henry Powell", detail: "Check on the contracts, Checked the casts and the property for safety and show quality." }
                    ],
                    training: [
                        { trainer: "Raul", trainee: "Jovi", module: "Area Washdown", n1: 0, n2: 0, n3: 0, assessment: "Pending Evaluation" }
                    ],
                    contracts: [
                        { name: "Kings Projects", workDone: "Scrub the Floor in WOD Male, Lime Garage and Uniqlo Guest RR" },
                        { name: "Kings Carpet Cleaning", workDone: "CIRQUE CURTAINS" }
                    ]
                },
                {
                    name: "Jonathan Jimenez",
                    status: "Active",
                    metrics: { scheduled: 152.0, actual: 152.0, callIn: 16.0, variance: 0.0, variancePct: 0.0000, attendanceRate: 1.0000 },
                    headcount: { present: 20, callSick: 0, fmla: 0, ado: 0, er: 0, ros: 0, late: 0, totalSched: 20 },
                    logs: [
                        { leader: "Jonathan Jimenez", detail: "Managed Marketplace area equipment deployment and chemical replenishment." }
                    ],
                    training: [{ trainer: "Jonathan", trainee: "Trainee B", module: "Area Washdown", n1: 1, n2: 1, n3: 1, assessment: "Passed - Certified" }],
                    contracts: [{ name: "Marketplace Washdown", workDone: "World of Disney perimeter pressure washing." }]
                },
                {
                    name: "Cheryl Moore",
                    status: "Off",
                    metrics: { scheduled: 168.0, actual: 0.0, callIn: 0.0, variance: -168.0, variancePct: -1.0000, attendanceRate: 0.0000 },
                    headcount: { present: 0, callSick: 0, fmla: 0, ado: 0, er: 0, ros: 0, late: 0, totalSched: 22 },
                    logs: [{ leader: "Cheryl Moore", detail: "Leader scheduled off for rotation." }],
                    training: [],
                    contracts: []
                },
                {
                    name: "Sabine Bade",
                    status: "Leave of Absence",
                    metrics: { scheduled: 168.0, actual: 0.0, callIn: 0.0, variance: -168.0, variancePct: -1.0000, attendanceRate: 0.0000 },
                    headcount: { present: 0, callSick: 0, fmla: 0, ado: 0, er: 0, ros: 0, late: 0, totalSched: 22 },
                    logs: [{ leader: "Sabine Bade", detail: "On approved Leave of Absence." }],
                    training: [],
                    contracts: []
                },
                {
                    name: "Roxanne Canales",
                    status: "Covering Overnight Duty",
                    metrics: { scheduled: 168.0, actual: 168.0, callIn: 0.0, variance: 0.0, variancePct: 0.0000, attendanceRate: 1.0000 },
                    headcount: { present: 22, callSick: 0, fmla: 0, ado: 0, er: 0, ros: 0, late: 0, totalSched: 22 },
                    logs: [{ leader: "Roxanne Canales", detail: "Covering overnight duty for alternate zone support." }],
                    training: [],
                    contracts: [{ name: "Overnight Support", workDone: "Backfill leadership for East Side." }]
                },
                {
                    name: "Michael Rivera",
                    status: "Off",
                    metrics: { scheduled: 168.0, actual: 0.0, callIn: 0.0, variance: -168.0, variancePct: -1.0000, attendanceRate: 0.0000 },
                    headcount: { present: 0, callSick: 0, fmla: 0, ado: 0, er: 0, ros: 0, late: 0, totalSched: 22 },
                    logs: [{ leader: "Michael Rivera", detail: "Off duty." }],
                    training: [],
                    contracts: []
                }
            ]
        };

        let appData = loadData();

        function loadData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    return JSON.parse(saved);
                }
            } catch (e) {}
            return defaultData;
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
                showToast("Saved locally!");
            } catch (e) {}
        }

        async function copyTeamData() {
            try {
                const dataString = JSON.stringify(appData);
                await navigator.clipboard.writeText(dataString);
                showToast("Team data copied to clipboard!");
            } catch (e) {
                prompt("Copy this team data code:", JSON.stringify(appData));
            }
        }

        async function pasteTeamData() {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    appData = JSON.parse(text);
                    saveData();
                    renderApp();
                    showToast("Team data loaded successfully!");
                    return;
                }
            } catch (e) {}
            const manualText = prompt("Paste your team data code here:");
            if (manualText) {
                try {
                    appData = JSON.parse(manualText);
                    saveData();
                    renderApp();
                    showToast("Team data loaded successfully!");
                } catch (err) {
                    alert("Invalid team data code.");
                }
            }
        }

        function exportBackup() {
            const now = new Date();
            const dateStr = now.toISOString().split('T')[0];
            const timeStr = String(now.getHours()).padStart(2, '0') + '-' + String(now.getMinutes()).padStart(2, '0');
            // Timestamp first so it's instantly visible at a glance
            const filename = `${dateStr}_${timeStr}_Shift_Recap.json`;

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", filename);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast(`Saved as ${filename}`);
        }

        function importBackup(event) {
            const fileReader = new FileReader();
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = function(e) {
                    try {
                        appData = JSON.parse(e.target.result);
                        saveData();
                        renderApp();
                        showToast("Backup loaded successfully!");
                    } catch (error) {
                        alert("Invalid backup file.");
                    }
                };
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').innerText = msg;
            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 1800);
        }

        const activeLeadersList = ["Henry Powell", "Zoroaya Hernandez", "Jonathan Jimenez", "Cheryl Moore", "Sabine Bade", "Roxanne Canales", "Michael Rivera"];
        const trainingModulesList = ["Area Washdown", "Pressure washing", "Night 1 Facilitation", "Trainer on Duty"];

        function renderTabs() {
            const container = document.getElementById('leaderTabs');
            container.innerHTML = '';
            appData.leaders.forEach(leader => {
                const isActive = leader.name === appData.activeTab;
                let statusColor = 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30';
                if (leader.status === 'Off') statusColor = 'bg-amber-500/20 text-amber-400 border-amber-500/30';
                if (leader.status === 'Leave of Absence') statusColor = 'bg-rose-500/20 text-rose-400 border-rose-500/30';
                if (leader.status === 'Covering Overnight Duty') statusColor = 'bg-purple-500/20 text-purple-400 border-purple-500/30';

                const btn = document.createElement('button');
                btn.className = `px-4 py-3 rounded-xl font-medium text-sm whitespace-nowrap transition flex items-center gap-2.5 border ${isActive ? 'bg-indigo-600 border-indigo-500 text-white shadow-lg shadow-indigo-600/30' : 'bg-slate-900 border-slate-800 text-slate-300 hover:bg-slate-800'}`;
                btn.innerHTML = `<span>${leader.name}</span><span class="text-[10px] px-2 py-0.5 rounded-full border ${statusColor}">${leader.status}</span>`;
                btn.onclick = () => {
                    appData.activeTab = leader.name;
                    renderApp();
                };
                container.appendChild(btn);
            });
        }

        function renderApp() {
            try {
                renderTabs();
                const container = document.getElementById('tabContentContainer');
                const leader = appData.leaders.find(l => l.name === appData.activeTab) || appData.leaders[0];
                if (!leader.headcount) {
                    leader.headcount = { present: 0, callSick: 0, fmla: 0, ado: 0, er: 0, ros: 0, late: 0, totalSched: 0 };
                }

                let statusColor = 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30';
                if (leader.status === 'Off') statusColor = 'bg-amber-500/20 text-amber-400 border-amber-500/30';
                if (leader.status === 'Leave of Absence') statusColor = 'bg-rose-500/20 text-rose-400 border-rose-500/30';
                if (leader.status === 'Covering Overnight Duty') statusColor = 'bg-purple-500/20 text-purple-400 border-purple-500/30';

                let logsHtml = leader.logs.map((log, index) => `
                    <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col sm:flex-row gap-4 items-center justify-between">
                        <div class="w-full sm:w-56 shrink-0">
                            <span class="text-[10px] text-slate-400 uppercase block mb-1">Logging Leader</span>
                            <select onchange="updateLogLeader('${leader.name}', ${index}, this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-amber-300 font-semibold focus:outline-none focus:border-amber-500">
                                ${activeLeadersList.map(ldr => `<option value="${ldr}" ${log.leader === ldr ? 'selected' : ''}>${ldr}</option>`).join('')}
                            </select>
                        </div>
                        <div class="w-full grow">
                            <span class="text-[10px] text-slate-400 uppercase block mb-1">Shift Activity / Comment</span>
                            <textarea rows="2" oninput="updateLog('${leader.name}', ${index}, 'detail', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:border-amber-500 resize-y">${log.detail}</textarea>
                        </div>
                        <button onclick="deleteLog('${leader.name}', ${index})" class="text-slate-500 hover:text-rose-400 p-2 self-end sm:self-center transition"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                `).join('');

                let trainingHtml = leader.training.map((t, idx) => `
                    <tr class="hover:bg-slate-950/40">
                        <td class="p-3"><input type="text" value="${t.trainer}" oninput="updateTraining('${leader.name}', ${idx}, 'trainer', this.value)" class="bg-slate-950 border border-slate-700 rounded px-2 py-1 w-full text-white"></td>
                        <td class="p-3"><input type="text" value="${t.trainee}" oninput="updateTraining('${leader.name}', ${idx}, 'trainee', this.value)" class="bg-slate-950 border border-slate-700 rounded px-2 py-1 w-full text-white"></td>
                        <td class="p-3">
                            <select onchange="updateTraining('${leader.name}', ${idx}, 'module', this.value)" class="bg-slate-950 border border-slate-700 rounded px-2.5 py-1.5 w-full text-xs text-white font-medium">
                                ${trainingModulesList.map(mod => `<option value="${mod}" ${t.module === mod ? 'selected' : ''}>${mod}</option>`).join('')}
                            </select>
                        </td>
                        <td class="p-3 text-center"><label class="text-[10px] text-slate-400 block">Night 1</label><input type="checkbox" ${t.n1 ? 'checked' : ''} onchange="updateTraining('${leader.name}', ${idx}, 'n1', this.checked ? 1 : 0)" class="w-4 h-4 rounded bg-slate-950 border-slate-700 text-purple-600 cursor-pointer"></td>
                        <td class="p-3 text-center"><label class="text-[10px] text-slate-400 block">Night 2</label><input type="checkbox" ${t.n2 ? 'checked' : ''} onchange="updateTraining('${leader.name}', ${idx}, 'n2', this.checked ? 1 : 0)" class="w-4 h-4 rounded bg-slate-950 border-slate-700 text-purple-600 cursor-pointer"></td>
                        <td class="p-3 text-center"><label class="text-[10px] text-slate-400 block">Night 3</label><input type="checkbox" ${t.n3 ? 'checked' : ''} onchange="updateTraining('${leader.name}', ${idx}, 'n3', this.checked ? 1 : 0)" class="w-4 h-4 rounded bg-slate-950 border-slate-700 text-purple-600 cursor-pointer"></td>
                        <td class="p-3">
                            <label class="text-[10px] text-slate-400 block">Assessment</label>
                            <select onchange="updateTraining('${leader.name}', ${idx}, 'assessment', this.value)" class="bg-slate-950 border border-slate-700 rounded px-2 py-1 w-full text-xs font-semibold text-amber-400">
                                <option value="Pending Evaluation" ${t.assessment === 'Pending Evaluation' ? 'selected' : ''}>Pending Evaluation</option>
                                <option value="Passed - Certified" ${t.assessment === 'Passed - Certified' ? 'selected' : ''}>Passed - Certified</option>
                                <option value="Needs Remediation" ${t.assessment === 'Needs Remediation' ? 'selected' : ''}>Needs Remediation</option>
                            </select>
                        </td>
                        <td class="p-3 text-right"><button onclick="deleteTraining('${leader.name}', ${idx})" class="text-slate-500 hover:text-rose-400 p-1"><i class="fa-solid fa-trash-can"></i></button></td>
                    </tr>
                `).join('');

                let contractsHtml = leader.contracts.map((c, idx) => `
                    <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col md:flex-row gap-4 items-center justify-between">
                        <div class="w-full md:w-1/3"><input type="text" value="${c.name}" oninput="updateContract('${leader.name}', ${idx}, 'name', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-xs font-bold text-white"></div>
                        <div class="w-full grow"><input type="text" value="${c.workDone}" oninput="updateContract('${leader.name}', ${idx}, 'workDone', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-xs text-slate-200"></div>
                        <button onclick="deleteContract('${leader.name}', ${idx})" class="text-slate-500 hover:text-rose-400 p-2"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                `).join('');

                container.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-wrap justify-between items-center gap-4">
                        <div>
                            <div class="flex items-center gap-3">
                                <h2 class="text-2xl font-bold text-white">${leader.name}</h2>
                                <span class="text-xs px-3 py-1 rounded-full border font-medium ${statusColor}">${leader.status}</span>
                            </div>
                            <p class="text-sm text-slate-400 mt-1">3rd Shift Custodial Operations — End of Shift Recap & Log</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Operational Status:</label>
                            <select onchange="updateLeaderStatus('${leader.name}', this.value)" class="bg-slate-950 border border-slate-700 text-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                                <option value="Active" ${leader.status === 'Active' ? 'selected' : ''}>Active</option>
                                <option value="Off" ${leader.status === 'Off' ? 'selected' : ''}>Off</option>
                                <option value="Covering Overnight Duty" ${leader.status === 'Covering Overnight Duty' ? 'selected' : ''}>Covering Overnight Duty</option>
                                <option value="Leave of Absence" ${leader.status === 'Leave of Absence' ? 'selected' : ''}>Leave of Absence (LOA)</option>
                            </select>
                        </div>
                    </div>

                    <!-- 1. Shift Attendance & Labor Metrics -->
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                        <div class="flex justify-between items-center">
                            <h3 class="text-base font-bold text-cyan-400"><i class="fa-solid fa-chart-line"></i> 1. Shift Attendance & Labor Metrics</h3>
                            <button onclick="recalcMetrics('${leader.name}')" class="text-xs text-indigo-400 bg-indigo-500/10 px-3 py-1 rounded-lg border border-indigo-500/30">Recalculate</button>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4">
                            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                <span class="text-[11px] font-semibold text-slate-400 block">Scheduled Labor (Hrs)</span>
                                <input type="number" step="0.1" id="schedLabor" value="${leader.metrics.scheduled.toFixed(1)}" onblur="formatDecimalInput(this)" oninput="syncMetrics('${leader.name}')" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-lg font-bold text-white mt-1">
                            </div>
                            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                <span class="text-[11px] font-semibold text-slate-400 block">Actual Labor (Hrs)</span>
                                <input type="number" step="0.1" id="actualLabor" value="${leader.metrics.actual.toFixed(1)}" onblur="formatDecimalInput(this)" oninput="syncMetrics('${leader.name}')" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-lg font-bold text-emerald-400 mt-1">
                            </div>
                            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                <span class="text-[11px] font-semibold text-slate-400 block">Call In Factor (Hrs)</span>

                const todayStr = new Date().toISOString().split('T')[0];

            } catch(err) {
                console.error("Render error:", err);
            }
        }

        function formatDecimalInput(input) {
            let val = parseFloat(input.value);
            if (!isNaN(val)) {
                input.value = val.toFixed(1);
            } else {
                input.value = "0.0";
            }
            syncMetrics(appData.activeTab);
        }

        function updateLeaderStatus(leaderName, status) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (l) l.status = status;
            saveData();
            renderApp();
        }

        function syncMetrics(leaderName) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (!l) return;
            l.metrics.scheduled = parseFloat(document.getElementById('schedLabor').value) || 0.0;
            l.metrics.actual = parseFloat(document.getElementById('actualLabor').value) || 0.0;
            l.metrics.callIn = parseFloat(document.getElementById('callInFactor').value) || 0.0;
            
            // STRICT VARIANCE FORMULA: Actual - Scheduled
            l.metrics.variance = Number((l.metrics.actual - l.metrics.scheduled).toFixed(1));
            l.metrics.variancePct = l.metrics.scheduled > 0 ? Number((l.metrics.variance / l.metrics.scheduled).toFixed(4)) : 0.0;
            l.metrics.attendanceRate = l.metrics.scheduled > 0 ? Number((l.metrics.actual / l.metrics.scheduled).toFixed(4)) : 0.0;
            
            document.getElementById('dispVariance').innerText = l.metrics.variance.toFixed(1);
            document.getElementById('dispVarPct').innerText = l.metrics.variancePct.toFixed(4);
            document.getElementById('dispAttRate').innerText = l.metrics.attendanceRate.toFixed(4);
            saveData();
        }

        function syncHeadcount(leaderName) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (!l) return;
            if (!l.headcount) l.headcount = { present: 0, callSick: 0, fmla: 0, ado: 0, er: 0, ros: 0, late: 0, totalSched: 0 };
            
            l.headcount.present = parseInt(document.getElementById('hcPresent').value) || 0;
            l.headcount.callSick = parseInt(document.getElementById('hcSick').value) || 0;
            l.headcount.fmla = parseInt(document.getElementById('hcFmla').value) || 0;
            l.headcount.ado = parseInt(document.getElementById('hcAdo').value) || 0;
            l.headcount.er = parseInt(document.getElementById('hcEr').value) || 0;
            l.headcount.ros = parseInt(document.getElementById('hcRos').value) || 0;
            l.headcount.late = parseInt(document.getElementById('hcLate').value) || 0;

            l.headcount.totalSched = l.headcount.present + l.headcount.callSick + l.headcount.fmla + l.headcount.ado;
            document.getElementById('dispTotalSched').innerText = l.headcount.totalSched;
            saveData();
        }

        function recalcMetrics(leaderName) {
            syncMetrics(leaderName);
            showToast("Metrics recalculated successfully!");
        }

        function addLogEntry(leaderName) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (l) l.logs.push({ leader: leaderName, detail: "New note..." });
            saveData();
            renderApp();
        }

        function updateLog(leaderName, idx, field, val) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (l && l.logs[idx]) { l.logs[idx][field] = val; saveData(); }
        }

        function updateLogLeader(leaderName, idx, newLeader) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (l && l.logs[idx]) { l.logs[idx].leader = newLeader; saveData(); }
        }

        function deleteLog(leaderName, idx) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (l) l.logs.splice(idx, 1);
            saveData();
            renderApp();
        }

        function addTraining(leaderName) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (l) l.training.push({ trainer: "Trainer", trainee: "Trainee", module: "Area Washdown", n1: 0, n2: 0, n3: 0, assessment: "Pending Evaluation" });
            saveData();
            renderApp();
        }

        function updateTraining(leaderName, idx, field, val) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (l && l.training[idx]) { l.training[idx][field] = val; saveData(); }
        }

        function deleteTraining(leaderName, idx) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (l) l.training.splice(idx, 1);
            saveData();
            renderApp();
        }

        function addContract(leaderName) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (l) l.contracts.push({ name: "Contract Task", workDone: "Work completed..." });
            saveData();
            renderApp();
        }

        function updateContract(leaderName, idx, field, val) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (l && l.contracts[idx]) { l.contracts[idx][field] = val; saveData(); }
        }

        function deleteContract(leaderName, idx) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (l) l.contracts.splice(idx, 1);
            saveData();
            renderApp();
        }

        function downloadEmlFile() {
            const leader = appData.leaders.find(l => l.name === appData.activeTab) || appData.leaders[0];
            const subject = `3rd Shift Custodial Operations Recap — ${appData.currentDate} (${leader.name})`;
            
            let htmlBody = `
                <html>
                <head>
                    <style>
                        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #0b132b; color: #f8fafc; margin: 0; padding: 20px; text-align: left; }
                        .container { max-width: 680px; margin: 0; background: #1c2541; border-radius: 16px; border: 1px solid #3a506b; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: left; }
                        .header { background: linear-gradient(135deg, #3a506b, #1c2541); padding: 24px; border-bottom: 1px solid #3a506b; }
                        .header h2 { color: #48cae4; margin: 0 0 6px 0; font-size: 22px; }
                        .header p { color: #94a3b8; margin: 0; font-size: 13px; }
                        .section { padding: 20px 24px; border-bottom: 1px solid #3a506b; }
                        .section h3 { color: #ffb703; font-size: 15px; margin-top: 0; text-transform: uppercase; letter-spacing: 0.5px; }
                        
                        /* Horizontal Cards for Metrics */
                        .metrics-row { display: table; width: 100%; table-layout: fixed; margin-top: 10px; }
                        .metric-card { display: table-cell; background: #0b132b; border: 1px solid #3a506b; padding: 10px 4px; text-align: center; border-radius: 6px; }
                        .metric-card + .metric-card { border-left: none; }
                        .card-label { font-size: 9px; color: #94a3b8; text-transform: uppercase; display: block; margin-bottom: 3px; }
                        .card-value { font-size: 14px; font-weight: bold; color: #ffffff; }

                        /* Horizontal Headcount Cards */
                        .hc-row { display: table; width: 100%; table-layout: fixed; margin-top: 10px; }
                        .hc-card { display: table-cell; background: #0b132b; border: 1px solid #3a506b; padding: 8px 4px; text-align: center; border-radius: 6px; }

                        ul { margin: 0; padding-left: 18px; color: #e2e8f0; font-size: 13px; line-height: 1.6; }
                        li { margin-bottom: 8px; }

                        /* Polished Contract Boxes / Brackets */
                        .contract-card { background: #0b132b; border: 1px solid #3a506b; border-radius: 10px; padding: 16px; margin-bottom: 14px; }
                        .contract-title { font-size: 13px; font-weight: bold; color: #48cae4; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
                        .contract-desc { background: #1c2541; border: 1px solid #48cae4; border-radius: 8px; padding: 12px; font-size: 13px; color: #f8fafc; line-height: 1.6; }

                        /* Training Table: Trainer -> Trainee -> Module -> Status */
                        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
                        th { background: #0b132b; color: #94a3b8; text-align: left; padding: 8px; border: 1px solid #3a506b; text-transform: uppercase; font-size: 10px; }
                        td { padding: 8px; border: 1px solid #3a506b; color: #f8fafc; }
                    </style>
                </head>
                <body>
                    <div class="container">
                        <div class="header">
                            <h2>Disney Springs 3rd Shift Operations</h2>
                            <p>Leader Recap & Shift Report — <strong>${leader.name}</strong> (${appData.currentDate})</p>
                        </div>
                        
                        <!-- 1. Labor & Attendance Metrics (Horizontal) -->
                        <div class="section">
                            <h3>1. Shift Attendance & Labor Metrics</h3>
                            <div class="metrics-row">
                                <div class="metric-card"><span class="card-label">Scheduled</span><span class="card-value">${leader.metrics.scheduled.toFixed(1)} hrs</span></div>
                                <div class="metric-card"><span class="card-label">Actual</span><span class="card-value" style="color: #34d399;">${leader.metrics.actual.toFixed(1)} hrs</span></div>
                                <div class="metric-card"><span class="card-label">Call-In</span><span class="card-value" style="color: #fbbf24;">${leader.metrics.callIn.toFixed(1)} hrs</span></div>
                                <div class="metric-card"><span class="card-label">Variance</span><span class="card-value" style="color: #818cf8;">${leader.metrics.variance.toFixed(1)} hrs</span></div>
                                <div class="metric-card"><span class="card-label">Var %</span><span class="card-value" style="color: #818cf8;">${(leader.metrics.variancePct * 100).toFixed(2)}%</span></div>
                                <div class="metric-card"><span class="card-label">Attendance</span><span class="card-value" style="color: #48cae4;">${(leader.metrics.attendanceRate * 100).toFixed(1)}%</span></div>
                            </div>

                            <!-- Headcount Breakdown (Horizontal) -->
                            <div style="margin-top: 15px;">
                                <span class="card-label" style="font-size: 11px; margin-bottom: 6px;">Cast Member Headcount & Attendance Status Breakdown</span>
                                <div class="hc-row">
                                    <div class="hc-card"><span class="card-label">Present</span><span class="card-value">${leader.headcount.present}</span></div>
                                    <div class="hc-card"><span class="card-label">Sick</span><span class="card-value" style="color: #f87171;">${leader.headcount.callSick}</span></div>
                                    <div class="hc-card"><span class="card-label">FMLA</span><span class="card-value" style="color: #f87171;">${leader.headcount.fmla}</span></div>
                                    <div class="hc-card"><span class="card-label">ADO</span><span class="card-value" style="color: #fbbf24;">${leader.headcount.ado}</span></div>
                                    <div class="hc-card"><span class="card-label">ER</span><span class="card-value" style="color: #48cae4;">${leader.headcount.er}</span></div>
                                    <div class="hc-card"><span class="card-label">ROS</span><span class="card-value" style="color: #48cae4;">${leader.headcount.ros}</span></div>
                                    <div class="hc-card"><span class="card-label">Late</span><span class="card-value" style="color: #48cae4;">${leader.headcount.late}</span></div>

                                </div>
                            </div>
                        </div>

                        <!-- 2. Shift Activity Logs -->
                        <div class="section">
                            <h3>2. Leadership End of Shift Logs</h3>
                            <ul>
                                ${leader.logs.map(l => `<li><strong>${l.leader}:</strong> ${l.detail}</li>`).join('')}
                            </ul>
                        </div>

                        <!-- 3. Training Tracker (Trainer -> Trainee -> Module -> Status) -->
                        <div class="section">
                            <h3>3. Training Tracker</h3>
                            <table>
                                <tr><th>Trainer</th><th>Trainee</th><th>Training Module</th><th>Status / Assessment</th></tr>
                                ${leader.training.map(t => `<tr><td>${t.trainer}</td><td>${t.trainee}</td><td>${t.module}</td><td style="color: #fbbf24; font-weight: bold;">${t.assessment}</td></tr>`).join('')}
                            </table>
                        </div>

                        <!-- 4. Specialized Contracts & Status (Styled Boxes) -->
                        <div class="section" style="border-bottom: none;">
                            <h3>4. Specialized Contracts & Work Completed</h3>
                            <div style="margin-top: 10px;">
                                ${leader.contracts.map(c => `
                                    <div class="contract-card">
                                        <div class="contract-title">${c.name}</div>
                                        <div class="contract-desc">${c.workDone}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </body>
                </html>
            `;

            const boundary = "----=_Part_" + Date.now();
            const emlContent = `X-Unsent: 1\n` +
                             `To: \n` +
                             `Cc: \n` +
                             `Subject: ${subject}\n` +
                             `MIME-Version: 1.0\n` +
                             `Content-Type: multipart/alternative; boundary="${boundary}"\n\n` +
                             `--${boundary}\n` +
                             `Content-Type: text/plain; charset=UTF-8\n` +
                             `Content-Transfer-Encoding: 7bit\n\n` +
                             `Disney Springs 3rd Shift Recap for ${leader.name} on ${appData.currentDate}.\n\n` +
                             `--${boundary}\n` +
                             `Content-Type: text/html; charset=UTF-8\n` +
                             `Content-Transfer-Encoding: 7bit\n\n` +
                             htmlBody + `\n\n` +
                             `--${boundary}--`;

            const blob = new Blob([emlContent], { type: 'message/rfc822' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Recap_${leader.name.replace(/\s+/g, '_')}_${appData.currentDate}.eml`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            showToast("EML File downloaded successfully!");
        }

        window.onload = function() {
            renderApp();
        };
    </script>
</body>
</html>
